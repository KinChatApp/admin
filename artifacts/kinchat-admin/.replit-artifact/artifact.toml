kind = "web"
previewPath = "/"
title = "KinChat Admin Panel"
description = "A standalone internal administration panel for KinChat, establishing the product’s visual identity, responsive navigation shell, overview dashboard, and future section placeholders."
version = "1.0.0"
id = "artifacts/kinchat-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22514

[services.development]
run = "pnpm --filter @workspace/kinchat-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kinchat-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/kinchat-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22514"
BASE_PATH = "/"
